[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "school-network-monitor"
version = "0.1.0"
description = "Campus Passive DHCP & SNMP Topology Monitoring Prototype"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
{name = "Campus Network Team"}
]
dependencies = [
"scapy>=2.5.0",
"pysnmplib>=5.0.0",
"pyyaml>=6.0.1",
"pydantic>=2.7.0",
"click>=8.1.7",
"pandas>=2.0.0",
"openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
"pytest>=8.2.0",
"pytest-cov>=5.0.0",
]

[project.scripts]
netmon = "network_monitor.main:cli_entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"