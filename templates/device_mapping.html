<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <title>內網 MAC 位址對應電腦名稱清冊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sortable { cursor: pointer; user-select: none; }
        .sortable:hover { background-color: #f1f5f9; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 p-6">
    <div class="max-w-6xl mx-auto">
        <!-- 頂部資訊列 -->
        <header class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 mb-6">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">內網 MAC 位址與電腦名稱對照清冊</h1>
                    <p class="text-sm text-slate-500 mt-1">彙整 DHCP Discover / Request / Inform 封包中解析出的實體主機對照清冊</p>
                    <div class="mt-2 flex gap-3 text-sm">
                        <a href="/" class="text-blue-600 hover:text-blue-800 font-semibold flex items-center gap-1">🏠 返回即時監控首頁</a>
                        <a href="/topology" class="text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-200">🌐 實體拓撲架構圖 ↗</a>
                    </div>
                </div>
                <button onclick="window.print()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded text-sm transition">
                    🖨️ 列印 / 匯出 PDF
                </button>
            </div>
            <div class="mt-4 pt-4 border-t flex flex-wrap items-center justify-between gap-4 text-sm text-slate-600">
                <div class="flex flex-wrap gap-6">
                    <div><span class="font-bold text-slate-700">清冊資料來源：</span><span id="sourceTitle" class="font-medium text-blue-600">載入中...</span></div>
                    <div><span class="font-bold text-slate-700">更新/時間窗：</span><span id="analysisTime" class="font-mono text-slate-700">-</span></div>
                    <div><span class="font-bold text-slate-700">已辨識裝置總數：</span><span id="deviceCount" class="font-bold text-emerald-600">載入中</span></div>
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-xs text-slate-500 font-medium">切換時間維度：</label>
                    <select id="windowSelect" onchange="changeTimeWindow(this.value)" class="border rounded px-2.5 py-1 text-xs bg-slate-50 text-slate-700 focus:ring-2 focus:ring-blue-500">
                        <option value="live">即時全網設備庫 (全部)</option>
                        <option value="15">最近 15 分鐘活躍</option>
                        <option value="30">最近 30 分鐘活躍</option>
                        <option value="60">最近 1 小時活躍</option>
                        <option value="1440">最近 24 小時活躍</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- 即時搜尋與篩選 -->
        <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200 mb-4 flex justify-between items-center">
            <div class="w-72">
                <input type="text" id="searchInput" onkeyup="filterDevices()" placeholder="🔍 搜尋電腦名稱、MAC 或 IP..." class="w-full border rounded px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="text-xs text-slate-400">
                點擊表格標頭欄位可進行升冪 / 降冪排序
            </div>
        </div>

        <!-- 裝置列表表格 -->
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-left text-sm" id="deviceTable">
                <thead class="bg-slate-50 text-slate-600 border-b">
                    <tr>
                        <th class="p-3 sortable" onclick="sortDevices('hostname')">電腦名稱 (Host Name) <span id="icon_hostname">⇅</span></th>
                        <th class="p-3 sortable" onclick="sortDevices('mac')">網路卡 MAC 位址 <span id="icon_mac">⇅</span></th>
                        <th class="p-3 sortable" onclick="sortDevices('device_name')">人工設備名稱 <span id="icon_device_name">⇅</span></th>
                        <th class="p-3 sortable" onclick="sortDevices('location')">擺放位置 <span id="icon_location">⇅</span></th>
                        <th class="p-3 sortable" onclick="sortDevices('ip')">關聯 / 分配 IP <span id="icon_ip">⇅</span></th>
                        <th class="p-3 sortable" onclick="sortDevices('last_seen')">最後活動時間 <span id="icon_last_seen">⇅</span></th>
                        <th class="p-3 text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="deviceTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>

    <!-- 編輯設備對話框 (Modal) -->
    <div id="editModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-lg border max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-slate-900 text-lg">✏️ 編輯設備人工備註</h3>
                <button type="button" onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">MAC 位址 (唯一識別)</label>
                <input type="text" id="modalMac" readonly class="w-full bg-slate-100 border rounded px-3 py-1.5 font-mono text-sm text-slate-700">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">設備自訂名稱 (例如：3F-會議室主機)</label>
                <input type="text" id="modalDeviceName" placeholder="請輸入人工設備名稱..." class="w-full border rounded px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">設備所在位置 (例如：綜合大樓 302 室)</label>
                <input type="text" id="modalLocation" placeholder="請輸入實體擺放位置..." class="w-full border rounded px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500">
            </div>
            <div id="modalMsg" class="text-xs hidden"></div>
            <div class="flex justify-end gap-2 pt-2 border-t">
                <button type="button" onclick="closeEditModal()" class="px-4 py-1.5 rounded text-sm text-slate-600 hover:bg-slate-100">取消</button>
                <button type="button" id="saveDeviceBtn" onclick="saveDeviceMetadata()" class="px-4 py-1.5 rounded text-sm bg-blue-600 hover:bg-blue-700 text-white font-medium shadow">儲存更新</button>
            </div>
        </div>
    </div>

    <script>
        let deviceSortState = { column: 'hostname', ascending: true };
        let deviceData = [];
        const initialJobId = {{ latest_job_id|tojson }};
        const urlParams = new URLSearchParams(window.location.search);

        function getDeviceQueryUrl() {
            const params = new URLSearchParams();
            if (urlParams.get('job_id')) {
                params.set('job_id', urlParams.get('job_id'));
            } else if (urlParams.get('start_time') && urlParams.get('end_time')) {
                params.set('start_time', urlParams.get('start_time'));
                params.set('end_time', urlParams.get('end_time'));
            } else if (urlParams.get('minutes')) {
                params.set('minutes', urlParams.get('minutes'));
            }
            const qs = params.toString();
            return `/api/v2/devices${qs ? '?' + qs : ''}`;
        }

        function changeTimeWindow(val) {
            const current = new URLSearchParams(window.location.search);
            current.delete('job_id');
            current.delete('start_time');
            current.delete('end_time');
            if (val === 'live') {
                current.delete('minutes');
            } else {
                current.set('minutes', val);
            }
            window.location.search = current.toString();
        }

        async function loadDevices() {
            const targetUrl = getDeviceQueryUrl();
            const sourceEl = document.getElementById('sourceTitle');
            const timeEl = document.getElementById('analysisTime');
            const countEl = document.getElementById('deviceCount');
            const selEl = document.getElementById('windowSelect');

            // 同步下拉選單狀態
            if (urlParams.get('minutes')) {
                selEl.value = urlParams.get('minutes');
            } else if (!urlParams.get('job_id') && !urlParams.get('start_time')) {
                selEl.value = 'live';
            }

            try {
                const response = await fetch(targetUrl);
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.detail || '設備資料查詢失敗');

                deviceData = payload.data || [];
                countEl.textContent = `${deviceData.length} 台`;

                // 標記來源與時間
                if (payload.source === 'job') {
                    sourceEl.textContent = `離線分析工作 (${payload.job_id || 'PCAP/CSV'})`;
                    timeEl.textContent = '靜態封包產出';
                } else if (payload.source === 'window') {
                    const st = payload.window.start_time.replace('T', ' ').replace('Z', ' UTC');
                    const et = payload.window.end_time.replace('T', ' ').replace('Z', ' UTC');
                    sourceEl.textContent = '時間窗動態分析';
                    timeEl.textContent = `${st} ～ ${et}`;
                } else {
                    sourceEl.textContent = '即時全網設備庫 (持續更新)';
                    timeEl.textContent = new Date().toLocaleString();
                }

                renderDevices();
            } catch (err) {
                sourceEl.textContent = '查詢異常';
                timeEl.textContent = err.message;
                countEl.textContent = '0 台';
                renderDevices();
            }
        }

        function renderDevices() {
            const tbody = document.getElementById('deviceTableBody');
            const fragment = document.createDocumentFragment();
            if (deviceData.length === 0) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 7;
                cell.className = 'p-6 text-center text-slate-400';
                cell.textContent = '目前時間區間內查無設備活動紀錄，可切換上方時間維度或至首頁查詢';
                row.appendChild(cell);
                fragment.appendChild(row);
            } else {
                deviceData.forEach(dev => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50 transition device-row';
                    row.dataset.mac = dev.mac || '';

                    // 電腦名稱
                    const tdHost = document.createElement('td');
                    tdHost.className = 'p-3 font-bold text-blue-700 dev-host';
                    tdHost.textContent = dev.hostname || '未知';

                    // MAC
                    const tdMac = document.createElement('td');
                    tdMac.className = 'p-3 font-mono text-slate-800 dev-mac';
                    tdMac.textContent = dev.mac || '-';

                    // 人工設備名稱
                    const tdDevName = document.createElement('td');
                    tdDevName.className = 'p-3 text-slate-800 font-medium dev-name';
                    tdDevName.textContent = dev.device_name || '-';

                    // 所在位置
                    const tdLoc = document.createElement('td');
                    tdLoc.className = 'p-3 text-slate-600 dev-loc';
                    tdLoc.textContent = dev.location || '-';

                    // IP
                    const tdIp = document.createElement('td');
                    tdIp.className = 'p-3 font-mono text-slate-600 dev-ip';
                    tdIp.textContent = dev.ip || '-';

                    // 時間
                    const tdTime = document.createElement('td');
                    tdTime.className = 'p-3 font-mono text-xs text-slate-500 dev-time';
                    tdTime.textContent = dev.last_seen || '-';

                    // 操作按鈕
                    const tdOp = document.createElement('td');
                    tdOp.className = 'p-3 text-center';
                    const btn = document.createElement('button');
                    btn.className = 'bg-blue-50 hover:bg-blue-100 text-blue-600 text-xs px-2.5 py-1 rounded font-medium border border-blue-200 transition';
                    btn.textContent = '✏️ 編輯';
                    btn.onclick = () => openEditModal(dev.mac, dev.device_name, dev.location);
                    tdOp.appendChild(btn);

                    row.append(tdHost, tdMac, tdDevName, tdLoc, tdIp, tdTime, tdOp);
                    fragment.appendChild(row);
                });
            }
            tbody.replaceChildren(fragment);
        }

        function openEditModal(mac, deviceName, location) {
            document.getElementById('modalMac').value = mac || '';
            document.getElementById('modalDeviceName').value = deviceName || '';
            document.getElementById('modalLocation').value = location || '';
            const msg = document.getElementById('modalMsg');
            msg.className = 'text-xs hidden';
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function saveDeviceMetadata() {
            const mac = document.getElementById('modalMac').value;
            const deviceName = document.getElementById('modalDeviceName').value.trim();
            const location = document.getElementById('modalLocation').value.trim();
            const btn = document.getElementById('saveDeviceBtn');
            const msg = document.getElementById('modalMsg');

            btn.disabled = true;
            msg.className = 'text-xs text-blue-600 font-bold block';
            msg.textContent = '儲存中...';

            try {
                const res = await fetch(`/api/v2/devices/${encodeURIComponent(mac)}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        device_name: deviceName || null,
                        location: location || null
                    })
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || err.detail || '更新失敗');
                }
                const updated = (await res.json()).data;
                // 更新記憶體資料
                const target = deviceData.find(d => d.mac.toUpperCase() === mac.toUpperCase());
                if (target) {
                    target.device_name = updated.device_name;
                    target.location = updated.location;
                }
                renderDevices();
                msg.className = 'text-xs text-emerald-600 font-bold block';
                msg.textContent = '✅ 更新成功！';
                setTimeout(closeEditModal, 800);
            } catch (e) {
                msg.className = 'text-xs text-rose-600 font-bold block';
                msg.textContent = `❌ ${e.message}`;
            } finally {
                btn.disabled = false;
            }
        }

        function filterDevices() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('.device-row');
            rows.forEach(row => {
                const host = row.querySelector('.dev-host').innerText.toLowerCase();
                const mac = row.querySelector('.dev-mac').innerText.toLowerCase();
                const ip = row.querySelector('.dev-ip').innerText.toLowerCase();
                const dname = row.querySelector('.dev-name').innerText.toLowerCase();
                const loc = row.querySelector('.dev-loc').innerText.toLowerCase();
                if (host.includes(query) || mac.includes(query) || ip.includes(query) || dname.includes(query) || loc.includes(query)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        function sortDevices(col) {
            const tbody = document.getElementById('deviceTableBody');
            const rows = Array.from(tbody.querySelectorAll('.device-row'));

            if (deviceSortState.column === col) {
                deviceSortState.ascending = !deviceSortState.ascending;
            } else {
                deviceSortState.column = col;
                deviceSortState.ascending = true;
            }

            rows.sort((a, b) => {
                let valA = a.querySelector(`.dev-${col === 'hostname' ? 'host' : col === 'mac' ? 'mac' : col === 'ip' ? 'ip' : 'time'}`).innerText.trim();
                let valB = b.querySelector(`.dev-${col === 'hostname' ? 'host' : col === 'mac' ? 'mac' : col === 'ip' ? 'ip' : 'time'}`).innerText.trim();

                return deviceSortState.ascending ? valA.localeCompare(valB) : valB.localeCompare(valA);
            });

            ['hostname', 'mac', 'ip', 'last_seen'].forEach(c => {
                const icon = document.getElementById(`icon_${c}`);
                if (icon) {
                    if (deviceSortState.column === c) {
                        icon.innerText = deviceSortState.ascending ? '▲' : '▼';
                        icon.className = 'text-blue-600 font-bold';
                    } else {
                        icon.innerText = '⇅';
                        icon.className = 'text-slate-400';
                    }
                }
            });

            tbody.replaceChildren();
            rows.forEach(row => tbody.appendChild(row));
        }

        loadDevices().catch(error => {
            document.getElementById('deviceTableBody').textContent = error.message;
        });
    </script>
</body>
</html>
